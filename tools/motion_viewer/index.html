<title>SmashNine 모션 뷰어</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&family=IBM+Plex+Sans+KR:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a sticky stage (one motion, large, with guides and a frame strip) beside a grid of every motion of the fighter playing at once. */
:root {
	--bg: #e8ebf1;
	--panel: #f8f9fb;
	--ink: #131a2c;
	--muted: #586179;
	--line: #cdd3de;
	--accent: #9a6508;
	--accent-soft: #f4e2b8;
	--guide: #08889e;
	--chk-a: #ffffff;
	--chk-b: #e1e6ee;
	--stage-dark: #121827;
	--stage-light: #f6f7f9;
	--font-display: "Silkscreen", "IBM Plex Mono", ui-monospace, monospace;
	--font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
	--font-mono: "IBM Plex Mono", ui-monospace, "Consolas", monospace;
}
@media (prefers-color-scheme: dark) {
	:root:not([data-theme="light"]) {
		--bg: #0c111e; --panel: #141b2c; --ink: #e7ebf4; --muted: #98a2bb; --line: #283150;
		--accent: #f1c25a; --accent-soft: #3a3020; --guide: #4fd1e8;
		--chk-a: #222a41; --chk-b: #1a2135; color-scheme: dark;
	}
}
:root[data-theme="dark"] {
	--bg: #0c111e; --panel: #141b2c; --ink: #e7ebf4; --muted: #98a2bb; --line: #283150;
	--accent: #f1c25a; --accent-soft: #3a3020; --guide: #4fd1e8;
	--chk-a: #222a41; --chk-b: #1a2135; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 1320px; margin: 0 auto; padding-inline: 16px; padding-block: 18px 40px; display: grid; gap: 16px; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 20px; }
.brand { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.logo { font-family: var(--font-display); font-size: 15px; letter-spacing: 0.08em; color: var(--accent); }
h1 { margin: 0; font-size: 26px; font-weight: 700; text-wrap: balance; }
.meta { margin: 0; color: var(--muted); font-family: var(--font-mono); font-size: 12.5px; font-variant-numeric: tabular-nums; }

.roster { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 8px; padding: 5px 12px 5px 6px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); cursor: pointer; }
.chip canvas { width: 32px; height: 32px; image-rendering: pixelated; border-radius: 50%; background: var(--chk-b); }
.chip .nm { font-family: var(--font-display); font-size: 13px; letter-spacing: 0.04em; }
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.chip.text { padding: 5px 12px; font-size: 13.5px; }
.forms { display: flex; flex-wrap: wrap; gap: 6px; }
.forms:empty { display: none; }

.layout { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 980px) {
	.layout { grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); align-items: start; }
	.stage-panel { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); }
}
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 14px; min-width: 0; }
.stage-head { display: flex; justify-content: space-between; align-items: start; gap: 12px; }
.stage-head h2 { margin: 0; font-family: var(--font-mono); font-size: 18px; font-weight: 500; overflow-wrap: anywhere; }
.stage-head p { margin: 2px 0 0; color: var(--muted); font-size: 13.5px; }
.counter { font-family: var(--font-display); font-size: 18px; white-space: nowrap; color: var(--accent); font-variant-numeric: tabular-nums; }

.stage { display: grid; place-items: center; min-height: 200px; border-radius: 8px; padding: 12px; overflow: hidden; }
.stage[data-bg="checker"], .tile .pic, .strip button {
	background-color: var(--chk-a);
	background-image: linear-gradient(45deg, var(--chk-b) 25%, transparent 25%, transparent 75%, var(--chk-b) 75%), linear-gradient(45deg, var(--chk-b) 25%, transparent 25%, transparent 75%, var(--chk-b) 75%);
	background-size: 16px 16px; background-position: 0 0, 8px 8px;
}
.stage[data-bg="dark"] { background: var(--stage-dark); }
.stage[data-bg="light"] { background: var(--stage-light); }
.stage canvas { display: block; max-width: 100%; height: auto; image-rendering: pixelated; }

.controls { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; }
.transport { display: flex; gap: 4px; }
.btn { min-width: 38px; height: 34px; padding: 0 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); cursor: pointer; font-family: var(--font-mono); font-size: 14px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--panel); min-width: 64px; font-weight: 500; }
.seg { display: inline-flex; align-items: center; gap: 6px; }
.seg > span { font-size: 12px; color: var(--muted); letter-spacing: 0.04em; }
.seg .opts { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label { padding: 5px 9px; font-size: 13px; cursor: pointer; font-family: var(--font-mono); background: var(--bg); }
.seg label + input + label { border-left: 1px solid var(--line); }
.seg input:checked + label { background: var(--accent-soft); color: var(--ink); font-weight: 500; }
.seg input:focus-visible + label { outline: 2px solid var(--accent); outline-offset: -2px; }
.toggles { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); }
.toggles label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
.toggles input { accent-color: var(--accent); }

.strip { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
.strip button { flex: none; padding: 0; border: 2px solid transparent; border-radius: 6px; cursor: pointer; position: relative; }
.strip button[aria-current="true"] { border-color: var(--accent); }
.strip canvas { display: block; width: 72px; height: 72px; image-rendering: pixelated; }
.strip b { position: absolute; left: 3px; top: 1px; font-family: var(--font-display); font-size: 10px; font-weight: 400; color: var(--muted); }

.facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px 16px; margin: 0; }
.facts div { min-width: 0; }
.facts dt { font-size: 11.5px; color: var(--muted); letter-spacing: 0.04em; }
.facts dd { margin: 0; font-family: var(--font-mono); font-size: 13px; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }

.group { display: grid; gap: 10px; }
.group + .group { margin-top: 10px; }
.group h3 { margin: 0; display: flex; justify-content: space-between; gap: 8px; align-items: baseline; font-size: 14px; }
.group h3 small { color: var(--muted); font-weight: 400; font-size: 12px; font-family: var(--font-mono); overflow-wrap: anywhere; text-align: right; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 10px; }
.tile { display: grid; gap: 6px; padding: 6px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); cursor: pointer; text-align: left; min-width: 0; }
.tile[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.tile .pic { border-radius: 5px; display: grid; place-items: center; aspect-ratio: 1; }
.tile canvas { width: 100%; max-width: 128px; aspect-ratio: 1; image-rendering: pixelated; }
.tile .n { font-family: var(--font-mono); font-size: 12.5px; font-weight: 500; overflow-wrap: anywhere; }
.tile .l { font-size: 11.5px; color: var(--muted); line-height: 1.35; overflow-wrap: anywhere; }
.tile .f { font-size: 11px; color: var(--muted); font-family: var(--font-mono); }
.note { margin: 0; padding: 10px 12px; border: 1px dashed var(--line); border-radius: 8px; color: var(--muted); font-size: 13px; }
.keys { color: var(--muted); font-size: 12.5px; margin: 0; }
kbd { font-family: var(--font-mono); font-size: 11.5px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; background: var(--panel); }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto; } }
</style>

<div class="wrap">
	<header class="top">
		<div class="brand"><span class="logo">SMASHNINE</span><h1>모션 뷰어</h1></div>
		<p class="meta" id="meta"></p>
	</header>

	<nav class="roster" id="roster" aria-label="캐릭터"></nav>
	<div class="forms" id="forms" aria-label="체형 또는 몬스터"></div>

	<main class="layout">
		<section class="panel stage-panel" aria-label="선택한 동작">
			<div class="stage-head">
				<div><h2 id="animName">-</h2><p id="animLabel"></p></div>
				<div class="counter" id="counter">0 / 0</div>
			</div>
			<div class="stage" id="stage" data-bg="checker"><canvas id="stageCanvas" width="384" height="384"></canvas></div>
			<div class="controls">
				<div class="transport">
					<button class="btn" id="prevBtn" type="button" aria-label="이전 프레임">◀</button>
					<button class="btn primary" id="playBtn" type="button">멈춤</button>
					<button class="btn" id="nextBtn" type="button" aria-label="다음 프레임">▶</button>
				</div>
				<div class="seg" role="radiogroup" aria-label="속도"><span>속도</span><div class="opts" id="speedOpts"></div></div>
				<div class="seg" role="radiogroup" aria-label="배율"><span>배율</span><div class="opts" id="zoomOpts"></div></div>
				<div class="seg" role="radiogroup" aria-label="배경"><span>배경</span><div class="opts" id="bgOpts"></div></div>
			</div>
			<div class="toggles">
				<label><input type="checkbox" id="gFeet"> 발 기준선</label>
				<label><input type="checkbox" id="gCell"> 칸 테두리</label>
				<label><input type="checkbox" id="gMargin"> 여백 4px</label>
				<label><input type="checkbox" id="gRepeat"> 한 번 동작도 반복</label>
			</div>
			<div class="strip" id="strip" aria-label="프레임"></div>
			<dl class="facts" id="facts"></dl>
			<p class="keys"><kbd>Space</kbd> 재생·멈춤 &nbsp; <kbd>←</kbd><kbd>→</kbd> 프레임 &nbsp; <kbd>↑</kbd><kbd>↓</kbd> 동작</p>
		</section>

		<section class="panel" aria-label="모든 동작"><div id="groups"></div></section>
	</main>
</div>

<script>
const M = /*MANIFEST*/null;
const STORE = "smashnine-motion-viewer";
const SPEEDS = [0.25, 0.5, 1, 2];
const ZOOMS = [1, 2, 3, 4];
const BGS = [["checker", "체크"], ["dark", "어둡게"], ["light", "밝게"]];
const BODY = { male: "남성", female: "여성", "": "" };

const entries = M.characters.map((c) => ({ id: c.id, name: c.name, forms: c.forms.map((f) => ({ label: BODY[f.body] || f.body, key: f.body, base: f.base, moves: f.moves })) }));
entries.push({ id: "monsters", name: "Monsters", forms: M.monsters.map((m) => ({ label: `${m.realm} · ${m.name}`, key: m.id, base: m.base, moves: null })) });

const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const state = { entry: 0, form: 0, anim: 0, playing: !reduce, speed: 1, zoom: 3, bg: "checker", feet: true, cell: false, margin: false, repeat: true };
try { Object.assign(state, JSON.parse(localStorage.getItem(STORE) || "{}")); } catch {}
const hashEntry = entries.findIndex((e) => e.id === location.hash.slice(1));
if (hashEntry >= 0 && hashEntry !== state.entry) { state.entry = hashEntry; state.form = 0; state.anim = 0; }
if (!entries[state.entry]) state.entry = 0;
if (!entries[state.entry].forms[state.form]) state.form = 0;
const save = () => { try { localStorage.setItem(STORE, JSON.stringify(state)); } catch {} };

const images = new Map();
function image(file) {
	if (!images.has(file)) { const img = new Image(); img.src = file; images.set(file, img); }
	return images.get(file);
}
const ready = (img) => img.complete && img.naturalWidth > 0;

function animsOf(form) {
	const list = [];
	for (const [group, sheet] of [["base", form.base], ["moves", form.moves]]) {
		if (!sheet) continue;
		sheet.rows.forEach((row, index) => list.push({ group, sheet, row, index }));
	}
	return list;
}
const curForm = () => entries[state.entry].forms[state.form];
let anims = [];

// Frame index for an animation after t seconds; one-shot rows hold their last frame 0.5 s, then repeat when asked.
function frameAt(row, t, repeat) {
	if (row.frames <= 1) return 0;
	if (row.loop) return Math.floor(t * row.fps) % row.frames;
	const span = row.frames / row.fps + 0.5;
	const local = repeat ? t % span : t;
	return Math.min(Math.floor(local * row.fps), row.frames - 1);
}
function drawCell(ctx, anim, frame, scale) {
	const img = image(anim.sheet.file), c = anim.sheet.cell;
	ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);
	if (!ready(img)) return false;
	ctx.imageSmoothingEnabled = false;
	ctx.drawImage(img, frame * c, anim.index * c, c, c, 0, 0, c * scale, c * scale);
	return true;
}

const $ = (id) => document.getElementById(id);
const stageCanvas = $("stageCanvas"), sctx = stageCanvas.getContext("2d");
let stageT = 0, stageFrame = 0, tiles = [], stripButtons = [];

function segment(host, name, options, current, onPick) {
	host.innerHTML = "";
	options.forEach(([value, text], i) => {
		const id = `${name}-${i}`;
		const input = Object.assign(document.createElement("input"), { type: "radio", name, id, value: String(value), checked: value === current });
		const label = Object.assign(document.createElement("label"), { htmlFor: id, textContent: text });
		input.addEventListener("change", () => onPick(value));
		host.append(input, label);
	});
}

function renderRoster() {
	const host = $("roster"); host.innerHTML = "";
	entries.forEach((e, i) => {
		const b = document.createElement("button");
		b.type = "button"; b.className = "chip"; b.setAttribute("aria-pressed", i === state.entry);
		const icon = document.createElement("canvas"); icon.width = 64; icon.height = 64;
		const first = e.forms[0] && e.forms[0].base;
		if (first) {
			const img = image(first.file);
			const paint = () => { const x = icon.getContext("2d"); x.imageSmoothingEnabled = false; x.drawImage(img, 0, 0, first.cell, first.cell, 0, 0, 64, 64); };
			ready(img) ? paint() : img.addEventListener("load", paint, { once: true });
		}
		const nm = Object.assign(document.createElement("span"), { className: "nm", textContent: e.name });
		b.append(icon, nm);
		b.addEventListener("click", () => { state.entry = i; state.form = 0; state.anim = 0; try { history.replaceState(null, "", `#${e.id}`); } catch {} select(); });
		host.append(b);
	});
}
function renderForms() {
	const host = $("forms"); host.innerHTML = "";
	const forms = entries[state.entry].forms;
	if (forms.length < 2) return;
	forms.forEach((f, i) => {
		const b = document.createElement("button");
		b.type = "button"; b.className = "chip text"; b.textContent = f.label;
		b.setAttribute("aria-pressed", i === state.form);
		b.addEventListener("click", () => { state.form = i; select(true); });
		host.append(b);
	});
}

function renderGroups() {
	const host = $("groups"); host.innerHTML = ""; tiles = [];
	const form = curForm();
	const sections = [["base", "기본 동작", form.base], ["moves", "기술 동작", form.moves]];
	for (const [key, title, sheet] of sections) {
		if (key === "moves" && entries[state.entry].id === "monsters") continue;
		const g = document.createElement("div"); g.className = "group";
		const h = document.createElement("h3");
		h.append(title);
		const small = document.createElement("small"); small.textContent = sheet ? sheet.file.replace("sheets/", "") : "";
		h.append(small); g.append(h);
		if (!sheet) {
			g.append(Object.assign(document.createElement("p"), { className: "note", textContent: "기술 시트가 없습니다. 게임에서는 기본 시트의 공격 4칸을 나눠 씁니다." }));
			host.append(g); continue;
		}
		const grid = document.createElement("div"); grid.className = "tiles";
		anims.forEach((a, i) => {
			if (a.group !== key) return;
			const b = document.createElement("button"); b.type = "button"; b.className = "tile";
			b.setAttribute("aria-pressed", i === state.anim);
			const pic = document.createElement("div"); pic.className = "pic";
			const c = document.createElement("canvas"); c.width = a.sheet.cell; c.height = a.sheet.cell; pic.append(c);
			const n = Object.assign(document.createElement("div"), { className: "n", textContent: a.row.name });
			const l = Object.assign(document.createElement("div"), { className: "l", textContent: a.row.label });
			const f = Object.assign(document.createElement("div"), { className: "f", textContent: `${a.row.frames}프레임 · ${fmt(a.row.fps)}fps${a.row.loop ? " · 반복" : ""}` });
			b.append(pic, n, l, f);
			b.addEventListener("click", () => { state.anim = i; select(false, true); });
			grid.append(b);
			tiles.push({ el: b, ctx: c.getContext("2d"), anim: a, t: 0, last: -1 });
		});
		g.append(grid); host.append(g);
	}
}
const fmt = (n) => (Math.round(n * 10) / 10).toString();

function renderStage() {
	const a = anims[state.anim];
	const form = curForm(), entry = entries[state.entry];
	$("animName").textContent = a ? a.row.name : "-";
	$("animLabel").textContent = a ? [a.row.label, `${entry.name}${form.label ? " · " + form.label : ""}`].filter(Boolean).join(" — ") : "";
	const strip = $("strip"); strip.innerHTML = ""; stripButtons = [];
	if (!a) return;
	for (let i = 0; i < a.row.frames; i++) {
		const b = document.createElement("button"); b.type = "button"; b.setAttribute("aria-label", `프레임 ${i + 1}`);
		const c = document.createElement("canvas"); c.width = a.sheet.cell; c.height = a.sheet.cell;
		const tag = Object.assign(document.createElement("b"), { textContent: String(i + 1) });
		b.append(c, tag);
		b.addEventListener("click", () => { setPlaying(false); setFrame(i); });
		strip.append(b); stripButtons.push({ el: b, ctx: c.getContext("2d"), i });
	}
	const dur = a.row.frames / a.row.fps;
	const facts = [
		["시트", a.sheet.file.replace("sheets/", "")],
		["줄", `${a.index + 1}번째 (y ${a.index * a.sheet.cell})`],
		["프레임", `${a.row.frames}칸`],
		["재생", `${fmt(a.row.fps)}fps · ${fmt(dur * 1000)}ms`],
		["방식", a.row.loop ? "반복" : "한 번"],
		["칸 · 발", `${a.sheet.cell}px · y ${a.sheet.feet}`],
	];
	$("facts").innerHTML = "";
	for (const [k, v] of facts) {
		const d = document.createElement("div");
		d.append(Object.assign(document.createElement("dt"), { textContent: k }), Object.assign(document.createElement("dd"), { textContent: v }));
		$("facts").append(d);
	}
	paintStrip();
}
function paintStrip() {
	const a = anims[state.anim]; if (!a) return;
	for (const s of stripButtons) {
		drawCell(s.ctx, a, s.i, 1);
		s.el.setAttribute("aria-current", s.i === stageFrame);
	}
}

function drawStage() {
	const a = anims[state.anim];
	const dpr = Math.max(1, Math.round(window.devicePixelRatio || 1));
	const cell = a ? a.sheet.cell : 128, scale = state.zoom * dpr;
	const size = cell * scale;
	if (stageCanvas.width !== size) { stageCanvas.width = size; stageCanvas.height = size; }
	stageCanvas.style.width = `${cell * state.zoom}px`;
	if (!a) { sctx.clearRect(0, 0, size, size); return; }
	drawCell(sctx, a, stageFrame, scale);
	const guide = getComputedStyle(document.documentElement).getPropertyValue("--guide").trim() || "#08889e";
	sctx.save();
	sctx.strokeStyle = guide; sctx.lineWidth = dpr;
	if (state.cell) sctx.strokeRect(dpr / 2, dpr / 2, size - dpr, size - dpr);
	if (state.margin) { sctx.setLineDash([2 * dpr, 3 * dpr]); const m = 4 * scale; sctx.strokeRect(m, m, size - 2 * m, size - 2 * m); }
	if (state.feet) { sctx.setLineDash([6 * dpr, 4 * dpr]); const y = a.sheet.feet * scale + scale / 2; sctx.beginPath(); sctx.moveTo(0, y); sctx.lineTo(size, y); sctx.stroke(); }
	sctx.restore();
	$("counter").textContent = `${stageFrame + 1} / ${a.row.frames}`;
}

function setFrame(i) {
	const a = anims[state.anim]; if (!a) return;
	stageFrame = (i + a.row.frames) % a.row.frames;
	stageT = (stageFrame + 0.001) / a.row.fps;
	drawStage(); paintStrip();
}
function setPlaying(on) {
	state.playing = on; $("playBtn").textContent = on ? "멈춤" : "재생"; save();
}

function select(keepAnim, onlyAnim) {
	if (!onlyAnim) {
		anims = animsOf(curForm());
		if (!keepAnim || !anims[state.anim]) state.anim = 0;
		if (keepAnim && anims[state.anim]) { /* same row index in the other body */ }
		renderRoster(); renderForms(); renderGroups();
	} else {
		tiles.forEach((t) => t.el.setAttribute("aria-pressed", anims.indexOf(t.anim) === state.anim));
	}
	stageT = 0; stageFrame = 0;
	renderStage(); drawStage(); save();
	for (const a of anims) { const img = image(a.sheet.file); if (!ready(img)) img.addEventListener("load", () => { drawStage(); paintStrip(); tiles.forEach((t) => (t.last = -1)); }, { once: true }); }
}

segment($("speedOpts"), "speed", SPEEDS.map((s) => [s, `${s}×`]), state.speed, (v) => { state.speed = v; save(); });
segment($("zoomOpts"), "zoom", ZOOMS.map((z) => [z, `${z}×`]), state.zoom, (v) => { state.zoom = v; drawStage(); save(); });
segment($("bgOpts"), "bg", BGS, state.bg, (v) => { state.bg = v; $("stage").dataset.bg = v; save(); });
$("stage").dataset.bg = state.bg;
for (const [id, key] of [["gFeet", "feet"], ["gCell", "cell"], ["gMargin", "margin"], ["gRepeat", "repeat"]]) {
	$(id).checked = state[key];
	$(id).addEventListener("change", (e) => { state[key] = e.target.checked; drawStage(); save(); });
}
$("playBtn").addEventListener("click", () => setPlaying(!state.playing));
$("prevBtn").addEventListener("click", () => { setPlaying(false); setFrame(stageFrame - 1); });
$("nextBtn").addEventListener("click", () => { setPlaying(false); setFrame(stageFrame + 1); });
document.addEventListener("keydown", (e) => {
	const t = e.target;
	if (t instanceof HTMLInputElement) return;
	if (e.key === " " && !(t instanceof HTMLButtonElement)) { e.preventDefault(); setPlaying(!state.playing); }
	else if (e.key === "ArrowLeft") { e.preventDefault(); setPlaying(false); setFrame(stageFrame - 1); }
	else if (e.key === "ArrowRight") { e.preventDefault(); setPlaying(false); setFrame(stageFrame + 1); }
	else if (e.key === "ArrowUp" || e.key === "ArrowDown") {
		e.preventDefault();
		state.anim = (state.anim + (e.key === "ArrowDown" ? 1 : -1) + anims.length) % anims.length;
		select(false, true);
	}
});

const meta = [M.commit && `커밋 ${M.commit}`, `${M.built} 빌드`, `캐릭터 ${M.characters.length}명 · 몬스터 ${M.monsters.length}종`].filter(Boolean).join(" · ");
$("meta").textContent = meta;
setPlaying(state.playing);
select(true);

let last = performance.now();
function tick(now) {
	const dt = Math.min(0.1, (now - last) / 1000) * state.speed; last = now;
	const a = anims[state.anim];
	if (a && state.playing) {
		stageT += dt;
		const f = frameAt(a.row, stageT, state.repeat);
		if (f !== stageFrame) { stageFrame = f; drawStage(); paintStrip(); }
	}
	for (const tile of tiles) {
		if (!reduce) tile.t += dt;
		const f = frameAt(tile.anim.row, tile.t, true);
		if (f !== tile.last && drawCell(tile.ctx, tile.anim, f, 1)) tile.last = f;
	}
	requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
</script>
